version: "3.8"

services:
  postgres:
    image: postgres:latest
    container_name: delta-gym-system-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: delta-gym-system-db
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
